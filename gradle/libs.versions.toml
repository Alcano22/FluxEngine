[versions]
kotlin               = "1.9.24"
kotlinxSerialization = "1.6.3"
kotlinxCoroutines    = "1.8.1"
lwjgl                = "3.4.1"
joml                 = "1.10.5"
jamepad              = "2.30.0.0"
imgui                = "1.92.0"
reflections          = "0.10.2"
kotlinLogging        = "6.0.9"
logback              = "1.5.6"

[libraries]
kotlin-reflect  = { module = "org.jetbrains.kotlin:kotlin-reflect",             version.ref = "kotlin" }
kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinxCoroutines" }

joml = { module = "org.joml:joml", version.ref = "joml" }

lwjgl-bom    = { module = "org.lwjgl:lwjgl-bom",    version.ref = "lwjgl" }
lwjgl-core   = { module = "org.lwjgl:lwjgl",        version.ref = "lwjgl" }
lwjgl-glfw   = { module = "org.lwjgl:lwjgl-glfw",   version.ref = "lwjgl" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl", version.ref = "lwjgl" }
lwjgl-stb    = { module = "org.lwjgl:lwjgl-stb",    version.ref = "lwjgl" }

jamepad = { module = "com.badlogicgames.jamepad:jamepad", version.ref = "jamepad" }

imgui-binding         = { module = "io.github.spair:imgui-java-binding",         version.ref = "imgui" }
imgui-lwjgl3          = { module = "io.github.spair:imgui-java-lwjgl3",          version.ref = "imgui" }
imgui-natives-windows = { module = "io.github.spair:imgui-java-natives-windows", version.ref = "imgui" }
imgui-natives-linux   = { module = "io.github.spair:imgui-java-natives-linux",   version.ref = "imgui" }
imgui-natives-macos   = { module = "io.github.spair:imgui-java-natives-macos",   version.ref = "imgui" }

reflections = { module = "org.reflections:reflections", version.ref = "reflections" }

kotlinLogging   = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlinLogging" }
logback-classic = { module = "ch.qos.logback:logback-classic",     version.ref = "logback" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
